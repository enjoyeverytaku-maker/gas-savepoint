<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavePoint 監査ログ</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e0e3e8;
    --text: #1f2430;
    --muted: #6b7280;
    --error: #c0392b;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header a { color: var(--accent); font-size: 13px; text-decoration: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #f0f2f5; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .result-success { color: #1a7f37; }
  .result-other { color: var(--error); }
  .empty, .loading-text, .error-message { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  .error-message { color: var(--error); }
</style>
</head>
<body>
<header>
  <h1>SavePoint 監査ログ</h1>
  <a href="/">← ダッシュボードへ戻る</a>
</header>
<main>
  <div id="loadingText" class="loading-text">読み込み中...</div>
  <div id="errorText" class="error-message" style="display:none;"></div>
  <div id="emptyText" class="empty" style="display:none;">操作履歴がありません。</div>
  <table id="logTable" style="display:none;">
    <thead>
      <tr>
        <th>日時</th>
        <th>ユーザー</th>
        <th>操作</th>
        <th>プロジェクト</th>
        <th>対象バージョン</th>
        <th>結果</th>
      </tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>
</main>

<script>
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function loadAuditLog() {
  const loadingEl = document.getElementById('loadingText');
  const errorEl = document.getElementById('errorText');
  const emptyEl = document.getElementById('emptyText');
  const tableEl = document.getElementById('logTable');
  const bodyEl = document.getElementById('logBody');

  let authHeaders = {};
  try {
    const statusRes = await fetch('/api/oauth/status');
    const status = await statusRes.json();
    if (status.dev_mode && status.email) {
      authHeaders = { 'X-Debug-User-Email': status.email };
    }
  } catch (e) {
    // dev_mode判定に失敗しても本番(IAP)では影響ないため無視する
  }

  const res = await fetch('/api/audit-logs', { headers: authHeaders });
  loadingEl.style.display = 'none';

  if (res.status === 401 || res.status === 403) {
    errorEl.style.display = 'block';
    errorEl.textContent = '監査ログの閲覧にはAdmin権限が必要です。';
    return;
  }
  if (!res.ok) {
    errorEl.style.display = 'block';
    errorEl.textContent = '監査ログの取得に失敗しました。';
    return;
  }

  const logs = await res.json();
  if (!logs.length) {
    emptyEl.style.display = 'block';
    return;
  }

  tableEl.style.display = 'table';
  bodyEl.innerHTML = logs.map((log) => `
    <tr>
      <td>${formatDate(log.timestamp)}</td>
      <td>${escapeHtml(log.user)}</td>
      <td>${escapeHtml(log.action)}</td>
      <td>${escapeHtml(log.project_id || '-')}</td>
      <td>${log.target_version ?? '-'}</td>
      <td class="${log.result === 'success' ? 'result-success' : 'result-other'}">${escapeHtml(log.result)}</td>
    </tr>
  `).join('');
}

loadAuditLog().catch((err) => {
  document.getElementById('loadingText').style.display = 'none';
  document.getElementById('errorText').style.display = 'block';
  document.getElementById('errorText').textContent = '読み込みに失敗しました: ' + err.message;
});
</script>
</body>
</html>

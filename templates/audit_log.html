<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavePoint 監査ログ</title>
<style>
  :root {
    color-scheme: light;
    --sidebar-bg: #14161b;
    --sidebar-text: #d6d8dc;
    --sidebar-muted: #8b9099;
    --sidebar-active-bg: #23262d;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e5e9;
    --text: #16181d;
    --muted: #767c86;
    --error: #c0392b;
    --accent: #23b26d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 24px 16px;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar .brand { font-size: 16px; font-weight: 700; color: #fff; padding: 0 8px 24px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav a {
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 6px;
  }
  .sidebar nav a:hover { background: var(--sidebar-active-bg); }
  .sidebar nav a.active { background: var(--sidebar-active-bg); color: #fff; font-weight: 600; }
  .sidebar .account-info { margin-top: auto; font-size: 12px; color: var(--sidebar-muted); padding: 8px; word-break: break-all; }
  .main-content { margin-left: 220px; flex: 1; min-width: 0; }
  h1.page-title { font-size: 20px; margin: 0 0 20px; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #f0f2f5; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .result-success { color: #1a7f37; }
  .result-other { color: var(--error); }
  .empty, .loading-text, .error-message { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  .error-message { color: var(--error); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">SavePoint</div>
    <nav>
      <a href="/">ダッシュボード</a>
      <a href="/ledger">台帳</a>
      <a href="/audit-log" class="active">監査ログ</a>
    </nav>
    <div class="account-info" id="accountInfo"></div>
  </aside>
  <div class="main-content">
  <main>
  <h1 class="page-title">監査ログ</h1>
  <div id="loadingText" class="loading-text">読み込み中...</div>
  <div id="errorText" class="error-message" style="display:none;"></div>
  <div id="emptyText" class="empty" style="display:none;">操作履歴がありません。</div>
  <table id="logTable" style="display:none;">
    <thead>
      <tr>
        <th>日時</th>
        <th>ユーザー</th>
        <th>操作</th>
        <th>プロジェクト</th>
        <th>対象バージョン</th>
        <th>結果</th>
      </tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>
  </main>
  </div>
</div>

<script>
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function loadAuditLog() {
  const loadingEl = document.getElementById('loadingText');
  const errorEl = document.getElementById('errorText');
  const emptyEl = document.getElementById('emptyText');
  const tableEl = document.getElementById('logTable');
  const bodyEl = document.getElementById('logBody');

  let authHeaders = {};
  try {
    const statusRes = await fetch('/api/oauth/status');
    const status = await statusRes.json();
    if (status.dev_mode && status.email) {
      authHeaders = { 'X-Debug-User-Email': status.email };
    }
    document.getElementById('accountInfo').textContent = status.email ? `接続中: ${status.email}` : '';
  } catch (e) {
    // dev_mode判定に失敗しても本番(IAP)では影響ないため無視する
  }

  const res = await fetch('/api/audit-logs', { headers: authHeaders });
  loadingEl.style.display = 'none';

  if (res.status === 401 || res.status === 403) {
    errorEl.style.display = 'block';
    errorEl.textContent = '監査ログの閲覧にはAdmin権限が必要です。';
    return;
  }
  if (!res.ok) {
    errorEl.style.display = 'block';
    errorEl.textContent = '監査ログの取得に失敗しました。';
    return;
  }

  const logs = await res.json();
  if (!logs.length) {
    emptyEl.style.display = 'block';
    return;
  }

  tableEl.style.display = 'table';
  bodyEl.innerHTML = logs.map((log) => `
    <tr>
      <td>${formatDate(log.timestamp)}</td>
      <td>${escapeHtml(log.user)}</td>
      <td>${escapeHtml(log.action)}</td>
      <td>${escapeHtml(log.project_id || '-')}</td>
      <td>${log.target_version ?? '-'}</td>
      <td class="${log.result === 'success' ? 'result-success' : 'result-other'}">${escapeHtml(log.result)}</td>
    </tr>
  `).join('');
}

loadAuditLog().catch((err) => {
  document.getElementById('loadingText').style.display = 'none';
  document.getElementById('errorText').style.display = 'block';
  document.getElementById('errorText').textContent = '読み込みに失敗しました: ' + err.message;
});
</script>
</body>
</html>

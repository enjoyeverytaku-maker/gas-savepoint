<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavePoint 変更履歴</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --sidebar-bg: #14161b;
    --sidebar-text: #d6d8dc;
    --sidebar-muted: #7d838e;
    --sidebar-muted2: #aab0ba;
    --sidebar-box-bg: #1b1e25;
    --sidebar-box-border: #2a2e37;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e4e7ec;
    --border-strong: #d5d9e0;
    --divider: #f0f2f5;
    --text: #16181d;
    --text-strong: #2a2e37;
    --text-body: #3a3f47;
    --muted: #6b7280;
    --muted2: #8a9099;
    --accent: #23b26d;
    --accent-dark: #1c8f58;
    --accent-bg: #eaf7f0;
    --error: #c0392b;
    --code-bg: #f4f6f8;
    --font-sans: 'IBM Plex Sans', 'Noto Sans JP', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { font-family: var(--font-sans); background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
  .app { display: flex; min-height: 100vh; align-items: stretch; }
  .sidebar { width: 248px; flex: 0 0 248px; background: var(--sidebar-bg); color: var(--sidebar-text); padding: 22px 14px 16px; position: sticky; top: 0; align-self: flex-start; height: 100vh; display: flex; flex-direction: column; }
  .sidebar .brand-row { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
  .sidebar .brand-icon { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .sidebar .brand-name { color: #fff; font-size: 15.5px; font-weight: 700; letter-spacing: -.005em; }
  .sidebar .brand-sub { color: var(--sidebar-muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav a { display: flex; align-items: center; gap: 10px; color: var(--sidebar-muted2); text-decoration: none; font-size: 13.5px; padding: 9px 10px; border-radius: 7px; }
  .sidebar nav a svg { flex: 0 0 16px; }
  .sidebar nav a:hover { background: #23262d; }
  .sidebar nav a.active { background: #23262d; color: #fff; font-weight: 600; }
  .sidebar nav a[hidden] { display: none; }
  .sidebar .account-box { margin-top: auto; padding-top: 18px; }
  .sidebar .account-box .inner { padding: 11px 12px; border-radius: 8px; background: var(--sidebar-box-bg); border: 1px solid var(--sidebar-box-border); }
  .sidebar .account-box .dot-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .sidebar .account-box .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(35,178,109,.18); }
  .sidebar .account-box .label { font-size: 10px; letter-spacing: .06em; color: var(--sidebar-muted); text-transform: uppercase; }
  .sidebar .account-box .email { font-size: 12px; color: #e4e6ea; word-break: break-all; font-family: var(--font-mono); }
  .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  main { padding: 26px 32px 56px; max-width: 1080px; width: 100%; margin: 0 auto; }
  .eyebrow { font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--muted2); font-weight: 600; }
  h1.page-title { margin: 2px 0 0; font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
  .page-desc { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px 0 16px; }
  select { padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 13.5px; background: #fff; color: var(--text); min-width: 230px; }
  .filters { display: flex; gap: 4px; padding: 3px; background: #eef1f4; border-radius: 9px; }
  .filter { font-size: 12.5px; font-weight: 600; border: none; border-radius: 7px; padding: 7px 14px; cursor: pointer; background: transparent; color: var(--muted); }
  .filter.active { background: #fff; color: var(--text-strong); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .count-text { font-size: 12.5px; color: var(--muted); }
  .timeline-row { display: flex; gap: 16px; }
  .timeline-dot-col { flex: 0 0 14px; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
  .timeline-dot { width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 0 0 1.5px var(--border-strong); }
  .timeline-dot.unreleased { background: #dd9b1f; }
  .timeline-dot.released { background: var(--accent); }
  .timeline-line { flex: 1; width: 1.5px; background: var(--border); margin-top: 4px; }
  .change-card { flex: 1; min-width: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 1px 2px rgba(16,24,40,.04); overflow: hidden; margin-bottom: 12px; }
  .change-card .change-head { display: flex; align-items: center; gap: 11px; padding: 14px 18px; flex-wrap: wrap; }
  .change-card .pname { font-size: 14.5px; font-weight: 700; }
  .status-badge { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .status-badge.unreleased { background: #fdf3e0; color: #8a6620; }
  .status-badge.released { background: var(--accent-bg); color: var(--accent-dark); }
  .change-card .detected { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .change-card .counts { margin-left: auto; font-family: var(--font-mono); font-size: 12.5px; }
  .change-card .file-thead { display: grid; grid-template-columns: 2fr .8fr .6fr .6fr; gap: 12px; padding: 8px 18px; background: #fafbfc; font-size: 11px; font-weight: 700; color: var(--muted2); letter-spacing: .04em; border-top: 1px solid var(--divider); }
  .change-card .file-row { display: grid; grid-template-columns: 2fr .8fr .6fr .6fr; gap: 12px; padding: 10px 18px; border-top: 1px solid #f6f7f9; align-items: center; font-size: 12.5px; }
  .change-card .file-row .fname { font-family: var(--font-mono); word-break: break-all; }
  .change-card .status-tag { padding: 1px 7px; border-radius: 4px; background: #e6eaef; color: #5b6270; font-size: 10.5px; font-weight: 700; }
  .added { color: var(--accent-dark); font-weight: 600; }
  .deleted { color: var(--error); font-weight: 600; }
  .empty-dashed { background: var(--card-bg); border: 1px dashed var(--border-strong); border-radius: 10px; padding: 26px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty, .loading-text, .error-message { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  .error-message { color: var(--error); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="/" class="brand-row" style="text-decoration:none;color:inherit;">
      <div class="brand-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0c1a13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 4v6h6"></path></svg></div>
      <div><div class="brand-name">SavePoint</div><div class="brand-sub">GAS 変更管理</div></div>
    </a>
    <nav>
      <a href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>ダッシュボード</a>
      <a href="/ledger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5z"></path><path d="M8 4v16"></path></svg>台帳</a>
      <a href="/releases"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 4v6h6"></path></svg>セーブ管理</a>
      <a href="/changes" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6.5" cy="5.5" r="2.5"></circle><circle cx="6.5" cy="18.5" r="2.5"></circle><circle cx="17.5" cy="9" r="2.5"></circle><path d="M6.5 8v8"></path><path d="M17.5 11.5c0 3-3 4-6 4.5"></path></svg>変更履歴</a>
      <a href="/audit-log" id="auditLogLink" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z"></path><path d="M9.2 12.2l2 2 3.6-3.8"></path></svg>監査ログ</a>
      <a href="/users" id="usersLink" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19c1-3.2 3.3-5 5.5-5s4.5 1.8 5.5 5"></path><circle cx="17.5" cy="8.5" r="2.4"></circle><path d="M15.5 14c1.8.3 3.4 1.7 4 4.5"></path></svg>ユーザー管理</a>
    </nav>
    <div class="account-box"><div class="inner"><div class="dot-row"><span class="dot"></span><span class="label">接続中のGoogleアカウント</span></div><div class="email" id="accountInfo"></div></div></div>
  </aside>
  <div class="main-content">
  <main>
    <div class="eyebrow">Change log</div>
    <h1 class="page-title">変更履歴</h1>
    <div class="page-desc">自動検知が記録した変更の一覧です。この画面は記録を見るためのもので、操作はありません。</div>

    <div class="toolbar">
      <select id="projectSelect"><option value="">すべてのプロジェクト</option></select>
      <div class="filters" id="filters">
        <button type="button" class="filter active" data-status="all">すべて (<span data-count="all">0</span>)</button>
        <button type="button" class="filter" data-status="unreleased">未セーブ (<span data-count="unreleased">0</span>)</button>
        <button type="button" class="filter" data-status="released">セーブ済み (<span data-count="released">0</span>)</button>
      </div>
      <span class="count-text" id="countText"></span>
    </div>

    <div id="loadingText" class="loading-text">読み込み中...</div>
    <div id="errorText" class="error-message" style="display:none;"></div>
    <div id="emptyText" class="empty-dashed" style="display:none;">条件に合う変更の記録はありません。</div>
    <div id="timeline"></div>
  </main>
  </div>
</div>

<script>
const STATUS_LABELS = { unreleased: '未セーブ', released: 'セーブ済み' };

let authHeaders = {};
let allChanges = [];
let currentFilter = 'all';
let currentProjectId = '';
let projectNameMap = {};

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function apiFetch(url, options = {}) {
  const headers = { ...(options.headers || {}), ...authHeaders };
  return fetch(url, { ...options, headers });
}

function renderFileRows(diff) {
  if (!diff || diff.length === 0) return '';
  const thead = `<div class="file-thead"><span>ファイル</span><span>種別</span><span style="text-align:right;">追加</span><span style="text-align:right;">削除</span></div>`;
  const rows = diff.map((f) => `
    <div class="file-row">
      <span class="fname">${escapeHtml(f.name)}</span>
      <span><span class="status-tag">${escapeHtml(f.status)}</span></span>
      <span style="text-align:right;" class="added">+${f.added_lines}</span>
      <span style="text-align:right;" class="deleted">-${f.deleted_lines}</span>
    </div>
  `).join('');
  return thead + rows;
}

function renderChangeCard(change, isLast) {
  const row = document.createElement('div');
  row.className = 'timeline-row';
  const project = projectNameMap[change.project_id] || change.project_id;
  const addedTotal = (change.diff || []).reduce((sum, f) => sum + (f.added_lines || 0), 0);
  const deletedTotal = (change.diff || []).reduce((sum, f) => sum + (f.deleted_lines || 0), 0);
  row.innerHTML = `
    <div class="timeline-dot-col">
      <span class="timeline-dot ${change.display_status}"></span>
      ${isLast ? '' : '<span class="timeline-line"></span>'}
    </div>
    <div class="change-card">
      <div class="change-head">
        <span class="pname">${escapeHtml(project)}</span>
        <span class="status-badge ${change.display_status}">${STATUS_LABELS[change.display_status] || change.display_status}</span>
        <span class="detected">検知 ${formatDate(change.detected_at)}</span>
        <span class="counts"><span class="added">+${addedTotal}</span> <span class="deleted">-${deletedTotal}</span></span>
      </div>
      ${renderFileRows(change.diff)}
    </div>
  `;
  return row;
}

function applyFilterAndRender() {
  const loadingEl = document.getElementById('loadingText');
  const emptyEl = document.getElementById('emptyText');
  const timelineEl = document.getElementById('timeline');
  loadingEl.style.display = 'none';

  let filtered = allChanges;
  if (currentProjectId) filtered = filtered.filter((c) => c.project_id === currentProjectId);
  if (currentFilter !== 'all') filtered = filtered.filter((c) => c.display_status === currentFilter);

  timelineEl.innerHTML = '';
  document.getElementById('countText').textContent = `${filtered.length}件`;
  if (!filtered.length) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  filtered.forEach((change, i) => timelineEl.appendChild(renderChangeCard(change, i === filtered.length - 1)));

  const counts = { all: allChanges.length, unreleased: 0, released: 0 };
  const scoped = currentProjectId ? allChanges.filter((c) => c.project_id === currentProjectId) : allChanges;
  counts.all = scoped.length;
  scoped.forEach((c) => { if (counts[c.display_status] !== undefined) counts[c.display_status] += 1; });
  Object.keys(counts).forEach((key) => {
    const el = document.querySelector(`[data-count="${key}"]`);
    if (el) el.textContent = counts[key];
  });
}

async function loadChanges() {
  const errorEl = document.getElementById('errorText');
  errorEl.style.display = 'none';
  const url = currentProjectId ? `/api/projects/${currentProjectId}/changes` : '/api/changes';
  const res = await apiFetch(url, { headers: authHeaders });
  if (res.status === 401 || res.status === 403) {
    errorEl.style.display = 'block';
    errorEl.textContent = 'この操作には閲覧権限が必要です。';
    return;
  }
  if (!res.ok) {
    errorEl.style.display = 'block';
    errorEl.textContent = '変更一覧の取得に失敗しました。';
    return;
  }
  allChanges = await res.json();
  applyFilterAndRender();
}

async function init() {
  try {
    const statusRes = await fetch('/api/oauth/status');
    const status = await statusRes.json();
    if (status.dev_mode && status.email) {
      authHeaders = { 'X-Debug-User-Email': status.email };
    }
    window.__savepointUser = status.email || 'unknown';
    document.getElementById('accountInfo').textContent = status.email || '';
  } catch (e) {
    // dev_mode判定に失敗しても本番(IAP)では影響ないため無視する
  }

  try {
    const meRes = await apiFetch('/api/me');
    const me = await meRes.json();
    if (me.role === 'admin') {
      document.getElementById('auditLogLink').hidden = false;
      document.getElementById('usersLink').hidden = false;
    }
  } catch (e) {
    // 権限判定に失敗した場合はAPI側の403で最終防御される
  }

  const selectEl = document.getElementById('projectSelect');
  try {
    const res = await apiFetch('/api/projects', { headers: authHeaders });
    const projects = await res.json();
    projects.forEach((project) => {
      projectNameMap[project.id] = project.project_name;
      const opt = document.createElement('option');
      opt.value = project.id;
      opt.textContent = `${project.project_name}（${project.script_id}）`;
      selectEl.appendChild(opt);
    });
  } catch (e) {
    document.getElementById('errorText').style.display = 'block';
    document.getElementById('errorText').textContent = 'プロジェクト一覧の取得に失敗しました: ' + e.message;
  }

  const hashProjectId = location.hash.replace('#', '');
  if (hashProjectId) {
    selectEl.value = hashProjectId;
    currentProjectId = hashProjectId;
  }

  selectEl.addEventListener('change', () => {
    currentProjectId = selectEl.value;
    loadChanges();
  });

  document.getElementById('filters').addEventListener('click', (event) => {
    const btn = event.target.closest('.filter');
    if (!btn) return;
    document.querySelectorAll('.filter').forEach((f) => f.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.status;
    applyFilterAndRender();
  });

  await loadChanges();
}

init();
</script>
</body>
</html>

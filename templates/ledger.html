<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavePoint 台帳</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e0e3e8;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header a { color: var(--accent); font-size: 13px; text-decoration: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .form-grid label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .form-grid input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  button {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); margin-top: 10px; }
  button:hover { background: #f0f2f5; }
  button.primary:hover { background: #1d4fd6; }
  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  th { background: #f0f2f5; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td input { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
  .script-id { color: var(--muted); font-size: 12px; }
  .empty, .loading-text, .error-message, .notice { color: var(--muted); font-size: 14px; padding: 12px 0; text-align: center; }
  .error-message { color: #c0392b; }
</style>
</head>
<body>
<header>
  <h1>SavePoint 台帳</h1>
  <a href="/">← ダッシュボードへ戻る</a>
</header>
<main>
  <div id="permissionNotice" class="notice" style="display:none;"></div>

  <div class="card" id="registerCard" style="display:none;">
    <h2>+ 新規GASプロジェクト登録</h2>
    <div class="form-grid">
      <div><label>Project Name</label><input id="newProjectName" type="text"></div>
      <div><label>Script ID</label><input id="newScriptId" type="text"></div>
      <div><label>Google Account</label><input id="newGoogleAccount" type="text" placeholder="省略可"></div>
      <div><label>用途（Description）</label><input id="newDescription" type="text"></div>
      <div><label>担当部署</label><input id="newDepartment" type="text"></div>
      <div><label>ステータス</label><input id="newStatus" type="text" placeholder="例: active"></div>
    </div>
    <button type="button" class="primary" id="registerBtn">登録</button>
  </div>

  <div id="loadingText" class="loading-text">読み込み中...</div>
  <div id="errorText" class="error-message" style="display:none;"></div>
  <div id="emptyText" class="empty" style="display:none;">登録済みのGASプロジェクトがありません。</div>
  <table id="ledgerTable" style="display:none;">
    <thead>
      <tr>
        <th>Project Name</th>
        <th>Script ID / Google Account</th>
        <th>用途</th>
        <th>担当部署</th>
        <th>ステータス</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="ledgerBody"></tbody>
  </table>
</main>

<script>
let authHeaders = {};
let isAdmin = false;

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

async function apiFetch(url, options = {}) {
  const headers = { ...(options.headers || {}), ...authHeaders };
  return fetch(url, { ...options, headers });
}

function renderRow(project) {
  const tr = document.createElement('tr');
  tr.dataset.projectId = project.id;
  tr.innerHTML = `
    <td data-field="project_name">${escapeHtml(project.project_name)}</td>
    <td>
      <div class="script-id">${escapeHtml(project.script_id)}</div>
      <div class="script-id" data-field="google_account">${escapeHtml(project.google_account || '')}</div>
    </td>
    <td data-field="description">${escapeHtml(project.description || '')}</td>
    <td data-field="department">${escapeHtml(project.department || '')}</td>
    <td data-field="status">${escapeHtml(project.status || '')}</td>
    <td><button type="button" data-role="edit" ${isAdmin ? '' : 'disabled title="編集にはAdmin権限が必要です"'}>編集</button></td>
  `;
  return tr;
}

function startEdit(tr, project) {
  const fields = ['project_name', 'google_account', 'description', 'department', 'status'];
  const current = {};
  fields.forEach((f) => { current[f] = project[f] || ''; });

  tr.innerHTML = `
    <td><input data-field="project_name" value="${escapeHtml(current.project_name)}"></td>
    <td>
      <div class="script-id">${escapeHtml(project.script_id)}</div>
      <input data-field="google_account" value="${escapeHtml(current.google_account)}">
    </td>
    <td><input data-field="description" value="${escapeHtml(current.description)}"></td>
    <td><input data-field="department" value="${escapeHtml(current.department)}"></td>
    <td><input data-field="status" value="${escapeHtml(current.status)}"></td>
    <td>
      <button type="button" data-role="save" class="primary">保存</button>
      <button type="button" data-role="cancel">キャンセル</button>
    </td>
  `;

  tr.querySelector('[data-role="cancel"]').addEventListener('click', () => {
    const restoredRow = renderRow(project);
    tr.replaceWith(restoredRow);
    wireRowActions(restoredRow, project);
  });

  tr.querySelector('[data-role="save"]').addEventListener('click', async () => {
    const payload = {};
    fields.forEach((f) => {
      payload[f] = tr.querySelector(`[data-field="${f}"]`).value;
    });
    const res = await apiFetch(`/api/projects/${project.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok) {
      alert('更新に失敗しました: ' + (data.error ? data.error.message : '不明なエラー'));
      return;
    }
    const newRow = renderRow(data.project);
    tr.replaceWith(newRow);
    wireRowActions(newRow, data.project);
  });
}

function wireRowActions(tr, project) {
  const editBtn = tr.querySelector('[data-role="edit"]');
  if (!editBtn) return;
  editBtn.addEventListener('click', () => startEdit(tr, project));
}

async function loadLedger() {
  const loadingEl = document.getElementById('loadingText');
  const errorEl = document.getElementById('errorText');
  const emptyEl = document.getElementById('emptyText');
  const tableEl = document.getElementById('ledgerTable');
  const bodyEl = document.getElementById('ledgerBody');
  const registerCardEl = document.getElementById('registerCard');
  const noticeEl = document.getElementById('permissionNotice');

  const statusRes = await fetch('/api/oauth/status');
  const status = await statusRes.json();
  if (status.dev_mode && status.email) {
    authHeaders = { 'X-Debug-User-Email': status.email };
  }

  try {
    const meRes = await apiFetch('/api/me');
    const me = await meRes.json();
    isAdmin = me.role === 'admin';
  } catch (e) {
    isAdmin = false;
  }

  if (isAdmin) {
    registerCardEl.style.display = 'block';
  } else {
    noticeEl.style.display = 'block';
    noticeEl.textContent = '登録・編集にはAdmin権限が必要です。台帳の閲覧のみ可能です。';
  }

  const res = await apiFetch('/api/projects');
  loadingEl.style.display = 'none';

  if (res.status === 401 || res.status === 403) {
    errorEl.style.display = 'block';
    errorEl.textContent = '台帳の閲覧には権限が必要です。';
    return;
  }

  const projects = await res.json();
  if (!projects.length) {
    emptyEl.style.display = 'block';
    return;
  }

  tableEl.style.display = 'table';
  projects.forEach((project) => {
    const tr = renderRow(project);
    bodyEl.appendChild(tr);
    wireRowActions(tr, project);
  });
}

document.getElementById('registerBtn').addEventListener('click', async () => {
  const payload = {
    project_name: document.getElementById('newProjectName').value,
    script_id: document.getElementById('newScriptId').value,
    google_account: document.getElementById('newGoogleAccount').value || null,
    description: document.getElementById('newDescription').value,
    department: document.getElementById('newDepartment').value,
    status: document.getElementById('newStatus').value,
  };
  if (!payload.project_name || !payload.script_id) {
    alert('Project NameとScript IDは必須です。');
    return;
  }
  const res = await apiFetch('/api/projects', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert('登録に失敗しました: ' + (data.detail || res.statusText));
    return;
  }
  window.location.reload();
});

loadLedger().catch((err) => {
  document.getElementById('loadingText').style.display = 'none';
  document.getElementById('errorText').style.display = 'block';
  document.getElementById('errorText').textContent = '読み込みに失敗しました: ' + err.message;
});
</script>
</body>
</html>

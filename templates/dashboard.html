<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SavePoint ダッシュボード</title>
<style>
  :root {
    color-scheme: light;
    --sidebar-bg: #14161b;
    --sidebar-text: #d6d8dc;
    --sidebar-muted: #8b9099;
    --sidebar-active-bg: #23262d;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e5e9;
    --text: #16181d;
    --muted: #767c86;
    --ok: #23b26d;
    --warn: #b7791f;
    --error: #c0392b;
    --accent: #23b26d;
    --accent-dark: #1c8f58;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 24px 16px;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar .brand { font-size: 16px; font-weight: 700; color: #fff; padding: 0 8px 24px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .sidebar nav a {
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 6px;
  }
  .sidebar nav a:hover { background: var(--sidebar-active-bg); }
  .sidebar nav a.active { background: var(--sidebar-active-bg); color: #fff; font-weight: 600; }
  .sidebar nav a[hidden] { display: none; }
  .sidebar .account-info { margin-top: auto; font-size: 12px; color: var(--sidebar-muted); padding: 8px; word-break: break-all; }
  .main-content { margin-left: 220px; flex: 1; min-width: 0; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  .connect-banner {
    background: #fff7e6;
    border: 1px solid #f0c36d;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .connect-banner a {
    display: inline-block;
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .summary .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .summary .card .num { font-size: 28px; font-weight: 700; }
  .summary .card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .summary .card.warn .num { color: var(--warn); }
  .summary .card.error .num { color: var(--error); }
  h1.page-title { font-size: 20px; margin: 0 0 20px; }
  h2.section-title { font-size: 15px; margin: 0 0 10px; }
  .release-panel { margin-bottom: 24px; }
  .release-list { display: flex; flex-direction: column; gap: 10px; }
  .release-item {
    background: var(--card-bg);
    border: 1px solid #f0c36d;
    border-radius: 8px;
    padding: 14px 18px;
  }
  .release-item .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .release-item .project-name { font-weight: 600; font-size: 14px; }
  .release-item .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .release-item .comment { font-size: 13px; margin-top: 6px; }
  .release-item .actions { margin-top: 10px; display: flex; gap: 8px; }
  .release-empty {
    color: var(--muted);
    font-size: 13px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
  }
  .project-list { display: flex; flex-direction: column; gap: 12px; }
  .project-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
  }
  .project-card .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .project-card .name { font-size: 16px; font-weight: 600; }
  .project-card .script-id { font-size: 12px; color: var(--muted); }
  .status-badge { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .status-badge.ok { color: var(--ok); }
  .status-badge.warn { color: var(--warn); }
  .status-badge.error { color: var(--error); }
  .status-badge.loading { color: var(--muted); }
  .project-card .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }
  .project-card .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .action-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  button {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: #f0f2f5; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary, a.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
  }
  button.primary:hover, a.primary:hover { background: var(--accent-dark); }
  button.danger { color: var(--error); border-color: var(--error); }
  .diff-detail {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-size: 13px;
    display: none;
  }
  .diff-detail.open { display: block; }
  .diff-detail table { width: 100%; border-collapse: collapse; }
  .diff-detail th, .diff-detail td {
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
  }
  .diff-detail .added { color: var(--ok); }
  .diff-detail .deleted { color: var(--error); }
  .empty, .loading-text { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; }
  .error-message { color: var(--error); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">SavePoint</div>
    <nav>
      <a href="/" class="active">ダッシュボード</a>
      <a href="/ledger">台帳</a>
      <a href="/releases">セーブ管理</a>
      <a href="/changes">変更履歴</a>
      <a href="/audit-log" id="auditLogLink" hidden>監査ログ</a>
      <a href="/users" id="usersLink" hidden>ユーザー管理</a>
    </nav>
    <div class="account-info" id="accountInfo"></div>
  </aside>
  <div class="main-content">
    <main>
      <h1 class="page-title">ダッシュボード</h1>
      <div id="connectBanner" class="connect-banner" style="display:none;">
        Googleアカウントが未接続です。GASのソース取得・セーブポイント作成にはアカウント接続が必要です。
        <br>
        <a href="/oauth/connect">Googleアカウントを接続する</a>
      </div>

      <div class="summary" id="summary" style="display:none;">
        <div class="card"><div class="num" id="sumTotal">0</div><div class="label">GAS Projects</div></div>
        <div class="card warn"><div class="num" id="sumChanged">0</div><div class="label">変更あり</div></div>
        <div class="card"><div class="num" id="sumUnchanged">0</div><div class="label">変更なし</div></div>
        <div class="card error"><div class="num" id="sumError">0</div><div class="label">認証エラー</div></div>
      </div>

      <div class="release-panel" id="releasePanel" style="display:none;">
        <h2 class="section-title">未セーブの変更</h2>
        <div class="release-list" id="releaseList"></div>
      </div>

      <div id="projectList" class="project-list"></div>
      <div id="loadingText" class="loading-text">読み込み中...</div>
      <div id="emptyText" class="empty" style="display:none;">登録済みのGASプロジェクトがありません。</div>
    </main>
  </div>
</div>

<script>
const listEl = document.getElementById('projectList');
const loadingEl = document.getElementById('loadingText');
const emptyEl = document.getElementById('emptyText');
const summaryEl = document.getElementById('summary');
const connectBannerEl = document.getElementById('connectBanner');
const accountInfoEl = document.getElementById('accountInfo');
const releasePanelEl = document.getElementById('releasePanel');
const releaseListEl = document.getElementById('releaseList');

let projectsById = {};
let authHeaders = {};
let currentUserRole = null;

// 注: currentUserRoleはグローバルロール（/api/me）のみを見た簡易表示用ヒント。
// プロジェクト単位のロール（T20、gas_projects/{id}/membersでの上書き）は個別に
// フェッチしていないため、プロジェクトごとに実際の権限と食い違う場合がある
// （実際の許可判定は常にサーバー側require_project_roleが行うため安全側には倒れる）。
function canEdit() {
  return currentUserRole === 'developer' || currentUserRole === 'maintainer' || currentUserRole === 'owner';
}

function isAdmin() {
  return currentUserRole === 'owner';
}

async function apiFetch(url, options = {}) {
  const headers = { ...(options.headers || {}), ...authHeaders };
  return fetch(url, { ...options, headers });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatDate(iso) {
  if (!iso) return '未保存';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function renderCard(project) {
  const card = document.createElement('div');
  card.className = 'project-card';
  card.dataset.projectId = project.id;
  card.innerHTML = `
    <div class="row1">
      <div>
        <div class="name">${escapeHtml(project.project_name)}</div>
        <div class="script-id">${escapeHtml(project.script_id)}</div>
      </div>
      <div class="status-badge loading" data-role="status">● 確認中...</div>
    </div>
    <div class="meta" data-role="meta">最終保存：確認中...</div>
    <div class="error-message" data-role="error" style="display:none;"></div>
    <div class="actions">
      <button type="button" data-role="diff-toggle" disabled>差分を見る</button>
      <button type="button" data-role="detect" disabled>変更を検知</button>
      <a href="/releases#new/${project.id}" class="primary">セーブ画面へ →</a>
    </div>
    <div class="action-hint">GASの保存内容は編集した瞬間に反映されます。ここでの操作は「その変更を正式な記録として残すかどうか」を管理するものです。変更を検知＝今すぐチェックして変更履歴に記録（定期チェックを待たずに反映）／セーブ＝検知済みの変更をまとめてセーブポイントとして記録（AIが影響レビューを自動生成）</div>
    <div class="diff-detail" data-role="diff-detail"></div>
  `;
  return card;
}

function renderDiffTable(diff) {
  if (!diff || diff.length === 0) {
    return '<div>変更はありません。</div>';
  }
  const rows = diff.map((f) => `
    <tr>
      <td>${escapeHtml(f.name)}</td>
      <td>${escapeHtml(f.status)}</td>
      <td class="added">+${f.added_lines}</td>
      <td class="deleted">-${f.deleted_lines}</td>
    </tr>
  `).join('');
  return `<table><thead><tr><th>ファイル</th><th>状態</th><th>追加</th><th>削除</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function refreshProjectState(card, project) {
  const statusEl = card.querySelector('[data-role="status"]');
  const metaEl = card.querySelector('[data-role="meta"]');
  const errorEl = card.querySelector('[data-role="error"]');
  const diffToggleBtn = card.querySelector('[data-role="diff-toggle"]');
  const detectBtn = card.querySelector('[data-role="detect"]');
  const diffDetailEl = card.querySelector('[data-role="diff-detail"]');

  errorEl.style.display = 'none';
  diffDetailEl.classList.remove('open');

  let savepoints = [];
  try {
    const res = await apiFetch(`/api/projects/${project.id}/savepoints`);
    savepoints = await res.json();
  } catch (e) {
    savepoints = [];
  }
  const latest = savepoints[0];
  metaEl.textContent = `最終セーブ：${formatDate(latest ? latest.created_at : null)}`;

  const fetchRes = await apiFetch(`/api/projects/${project.id}/fetch`, { method: 'POST' });
  const fetchData = await fetchRes.json();

  if (!fetchData.ok) {
    statusEl.className = 'status-badge error';
    statusEl.textContent = '✕ 認証エラー';
    errorEl.style.display = 'block';
    errorEl.textContent = fetchData.error ? fetchData.error.message : '不明なエラーです';
    diffToggleBtn.disabled = true;
    detectBtn.disabled = true;
    card.dataset.state = 'error';
    return { state: 'error' };
  }

  const diff = fetchData.diff || [];
  diffToggleBtn.disabled = false;
  detectBtn.disabled = !canEdit();
  diffDetailEl.innerHTML = renderDiffTable(diff);

  if (diff.length === 0) {
    statusEl.className = 'status-badge ok';
    statusEl.textContent = '✓ 変更なし';
    card.dataset.state = 'unchanged';
    return { state: 'unchanged' };
  }

  const added = diff.reduce((sum, f) => sum + (f.added_lines || 0), 0);
  const deleted = diff.reduce((sum, f) => sum + (f.deleted_lines || 0), 0);
  statusEl.className = 'status-badge warn';
  statusEl.textContent = '⚠ 変更あり';
  metaEl.textContent += `　変更量：+${added} / -${deleted}（直近セーブとの比較）`;
  card.dataset.state = 'changed';
  return { state: 'changed' };
}

function wireCardActions(card, project) {
  const diffToggleBtn = card.querySelector('[data-role="diff-toggle"]');
  const detectBtn = card.querySelector('[data-role="detect"]');
  const diffDetailEl = card.querySelector('[data-role="diff-detail"]');

  diffToggleBtn.addEventListener('click', () => {
    diffDetailEl.classList.toggle('open');
  });

  detectBtn.addEventListener('click', async () => {
    detectBtn.disabled = true;
    detectBtn.textContent = '検知中...';
    try {
      const res = await apiFetch(`/api/projects/${project.id}/sync-check`, { method: 'POST' });
      const data = await res.json();
      if (!data.ok) {
        alert('検知に失敗しました: ' + (data.error ? data.error.message : '不明なエラー'));
      } else if (data.change) {
        alert('変更を検知し、変更履歴に記録しました。「セーブ画面へ」からセーブできます。');
      } else {
        alert('前回検知した内容から変わっていません。');
      }
    } finally {
      detectBtn.textContent = '変更を検知';
      await refreshProjectState(card, project);
      updateSummaryFromCards();
    }
  });
}

function updateSummaryFromCards() {
  const cards = Array.from(listEl.querySelectorAll('.project-card'));
  let changed = 0, unchanged = 0, error = 0;
  cards.forEach((card) => {
    const badge = card.querySelector('[data-role="status"]');
    if (badge.classList.contains('warn')) changed += 1;
    else if (badge.classList.contains('ok')) unchanged += 1;
    else if (badge.classList.contains('error')) error += 1;
  });
  document.getElementById('sumTotal').textContent = cards.length;
  document.getElementById('sumChanged').textContent = changed;
  document.getElementById('sumUnchanged').textContent = unchanged;
  document.getElementById('sumError').textContent = error;
  summaryEl.style.display = 'grid';
}

function renderChangeItem(change) {
  const project = projectsById[change.project_id];
  const projectName = project ? project.project_name : change.project_id;
  const addedTotal = (change.diff || []).reduce((sum, f) => sum + (f.added_lines || 0), 0);
  const deletedTotal = (change.diff || []).reduce((sum, f) => sum + (f.deleted_lines || 0), 0);
  const item = document.createElement('div');
  item.className = 'release-item';
  item.dataset.changeId = change.id;
  item.innerHTML = `
    <div class="row1">
      <div>
        <div class="project-name">${escapeHtml(projectName)}　<span class="status-badge warn" style="font-size:11px;">未セーブ</span></div>
        <div class="meta">検知日時：${formatDate(change.detected_at)}　変更量：+${addedTotal} / -${deletedTotal}</div>
      </div>
    </div>
    <div class="actions">
      <a href="/releases#new/${change.project_id}" class="primary">セーブ画面へ →</a>
    </div>
  `;
  return item;
}

async function refreshReleasePanel() {
  let changes = [];
  try {
    const res = await apiFetch('/api/changes');
    const data = await res.json();
    changes = Array.isArray(data) ? data.filter((c) => c.display_status === 'unreleased') : [];
  } catch (e) {
    changes = [];
  }
  changes.sort((a, b) => (b.detected_at || '').localeCompare(a.detected_at || ''));

  releaseListEl.innerHTML = '';
  if (!changes.length) {
    releasePanelEl.style.display = 'block';
    const empty = document.createElement('div');
    empty.className = 'release-empty';
    empty.textContent = '未セーブの変更はありません。';
    releaseListEl.appendChild(empty);
    return;
  }
  releasePanelEl.style.display = 'block';
  changes.forEach((change) => {
    releaseListEl.appendChild(renderChangeItem(change));
  });
}

async function loadDashboard() {
  const statusRes = await fetch('/api/oauth/status');
  const status = await statusRes.json();

  if (!status.connected) {
    connectBannerEl.style.display = 'block';
    loadingEl.style.display = 'none';
    return;
  }
  accountInfoEl.textContent = status.email ? `接続中: ${status.email}` : '';
  window.__savepointUser = status.email || 'unknown';
  if (status.dev_mode && status.email) {
    authHeaders = { 'X-Debug-User-Email': status.email };
  }

  try {
    const meRes = await apiFetch('/api/me');
    const me = await meRes.json();
    currentUserRole = me.role || null;
  } catch (e) {
    currentUserRole = null;
  }
  if (currentUserRole === 'owner') {
    document.getElementById('auditLogLink').hidden = false;
    document.getElementById('usersLink').hidden = false;
  }

  const projectsRes = await apiFetch('/api/projects');
  const projects = await projectsRes.json();

  loadingEl.style.display = 'none';

  if (!projects.length) {
    emptyEl.style.display = 'block';
    summaryEl.style.display = 'grid';
    return;
  }

  projectsById = Object.fromEntries(projects.map((p) => [p.id, p]));

  const cards = projects.map((project) => {
    const card = renderCard(project);
    listEl.appendChild(card);
    wireCardActions(card, project);
    return { card, project };
  });

  summaryEl.style.display = 'grid';
  document.getElementById('sumTotal').textContent = projects.length;

  await Promise.all([
    Promise.all(cards.map(({ card, project }) => refreshProjectState(card, project))),
    refreshReleasePanel(),
  ]);
  updateSummaryFromCards();
}

loadDashboard().catch((err) => {
  loadingEl.textContent = '読み込みに失敗しました: ' + err.message;
});
</script>
</body>
</html>
